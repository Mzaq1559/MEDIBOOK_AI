version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: medibook_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medibook
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: medibook_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medibook -d medibook_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - medibook

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medibook_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://medibook:password123@db:5432/medibook_db
      - DATABASE_POOL_SIZE=10
      - DATABASE_MAX_OVERFLOW=20
      - SECRET_KEY=your-super-secret-jwt-key-must-be-at-least-32-chars-long
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REFRESH_TOKEN_EXPIRE_DAYS=1
      - ENVIRONMENT=development
      - API_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:3000
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    networks:
      - medibook

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: medibook_ai_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://medibook:password123@db:5432/medibook_db
      - BACKEND_API_URL=http://backend:8000/api
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - AI_SERVICE_PORT=8001
      - AI_SERVICE_HOST=0.0.0.0
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - medibook

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medibook_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_CHAT_API_URL=http://localhost:8001/api
      - VITE_APP_NAME=MediBook AI
      - VITE_APP_VERSION=1.0.0
    depends_on:
      - backend
      - ai-service
    networks:
      - medibook

volumes:
  pgdata:

networks:
  medibook:
    driver: bridge